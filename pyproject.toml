[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ucas-qq-room-bot"
version = "3.1.0"
description = "可维护、可扩展的 UCAS 琴房预约 QQ Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "qq-botpy>=1.2.1",
  "PyYAML>=6.0.1",
  "APScheduler>=3.10.4,<4",
  "aiohttp>=3.9",
  "Jinja2>=3.1",
  "playwright>=1.49",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["qqbot*"]

[tool.setuptools.package-data]
"qqbot.presentation" = ["templates/*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
