bot_id: yql
site_id: site-yql
bot_name: 玉泉路琴房

credentials:
  appid_env: QQBOT_APPID
  secret_env: QQBOT_SECRET

database:
  path: data/yql/piano_room_yql.db

rooms:
  - id: yql-main
    name: 玉泉路琴房
    aliases: [玉泉路, 玉泉路排练室]

# 群主 QQ member_openid：可填在此处，或设置环境变量 QQBOT_OWNER_EXTERNAL_ID（推荐放 .env，勿提交到仓库）。
default_owner_external_id: ""

roles:
  levels:
    user: 0
    band: 1
    admin: 2
    owner: 3

booking:
  open_time: "07:00"
  close_time: "23:00"
  business_day_boundary: "22:00"
  max_query_offset: 2
  silent_period:
    start: "22:00"
    end: "22:03"
  advance_offsets:
    user: 0
    band: 1
    admin: 2
    owner: 2
  limits:
    regular_start: "07:00"
    rush_start: "22:00"
    regular:
      max_single_hours: 1.5
      max_daily_hours: 1.5
    rush:
      max_single_hours: 1.5
      max_daily_hours: 1.5

features:
  advance_booking: true
  weekly_routine: false
  broadcast: false

query:
  max_range_days: 7
  image_enabled: true
  default_ranges:
    user: [0, 0]
    band: [0, 1]
    admin: [0, 6]
    owner: [0, 6]
